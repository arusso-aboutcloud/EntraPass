<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.2" fill="#3d4654"/>
    </marker>

    <!-- Icons: style attrs live on the <g id> itself, never a wrapping
         ancestor (<use> only clones the referenced element's own
         attributes). Defined inside <defs> so they render only via
         <use>, not a second time at their own definition point. -->
    <g id="gh-icon" fill="#c9d1d9">
      <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z" transform="scale(0.9)"/>
    </g>
    <g id="cloud-icon" stroke="#fb923c" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 18a4.5 4.5 0 0 1-.5-8.98A6 6 0 0 1 17.6 10.5a3.75 3.75 0 0 1-.6 7.5H6.5z"/>
    </g>
    <g id="browser-icon" stroke="#5b9ef9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="22" height="17" rx="2.2"/>
      <line x1="1" y1="6" x2="23" y2="6"/>
      <circle cx="4.7" cy="3.5" r="0.8" fill="#5b9ef9" stroke="none"/>
      <circle cx="7.5" cy="3.5" r="0.8" fill="#5b9ef9" stroke="none"/>
    </g>
    <g id="shield-icon" stroke="#5b9ef9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 1.5l8 3v6.2c0 5-3.4 8.2-8 9.8-4.6-1.6-8-4.8-8-9.8V4.5l8-3z"/>
      <path d="M7.3 11l2.6 2.6 5-5.2"/>
    </g>
    <g id="key-icon" stroke="#fb923c" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="15" r="4.3"/>
      <path d="M10.5 11.5L20 2M14.5 6l3 3M17.5 3l3 3"/>
    </g>
    <g id="exchange-icon" stroke="#34d399" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 7h15M17 7l-4-4M17 7l-4 4"/>
      <path d="M20 15H5M5 15l4-4M5 15l4 4"/>
    </g>
    <g id="chart-icon" stroke="#a78bfa" fill="none" stroke-width="1.7" stroke-linecap="round">
      <line x1="3" y1="19" x2="3" y2="11"/>
      <line x1="9" y1="19" x2="9" y2="3"/>
      <line x1="15" y1="19" x2="15" y2="13"/>
      <line x1="21" y1="19" x2="21" y2="7"/>
    </g>
    <g id="grid-icon" stroke="#c9d1d9" fill="none" stroke-width="1.5">
      <rect x="1" y="1" width="8" height="8" rx="1.5"/>
      <rect x="13" y="1" width="8" height="8" rx="1.5"/>
      <rect x="1" y="13" width="8" height="8" rx="1.5"/>
      <rect x="13" y="13" width="8" height="8" rx="1.5"/>
    </g>
    <g id="save-icon" stroke="#fb923c" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3h13l5 5v13H3z"/>
      <rect x="7" y="3" width="8" height="6"/>
      <rect x="6" y="14" width="12" height="7"/>
    </g>
    <g id="sparkle-icon" fill="#fb923c">
      <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/>
    </g>
    <g id="doc-icon" stroke="#5b9ef9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2h9l4 4v16a1 1 0 0 1-1 1H3.9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/>
      <path d="M12 2v4h4"/>
      <line x1="6" y1="12" x2="14" y2="12"/>
      <line x1="6" y1="15.5" x2="14" y2="15.5"/>
      <line x1="6" y1="19" x2="11" y2="19"/>
    </g>
  </defs>

  <rect width="1200" height="830" rx="10" fill="#08080f"/>
  <rect x="0.5" y="0.5" width="1199" height="829" rx="10" fill="none" stroke="#1c1c2c" stroke-width="1"/>

  <!-- Title -->
  <text x="32" y="36" fill="#f0f0f5" font-size="18" font-weight="600">EntraPass · Architecture</text>
  <text x="32" y="55" fill="rgba(240,240,245,0.55)" font-size="11">Browser-only · PKCE · read-only Microsoft Graph · all tenant data stays on-device</text>
  <line x1="32" y1="68" x2="1168" y2="68" stroke="#1c1c2c" stroke-width="1"/>

  <!-- ── DEPLOYMENT ────────────────────────────────────────────── -->
  <text x="32" y="90" fill="rgba(240,240,245,0.55)" font-size="10" font-weight="600" letter-spacing="1.5">DEPLOYMENT</text>

  <g font-size="10">
    <g transform="translate(32,98)">
      <rect width="270" height="56" rx="8" fill="#0f0f1a" stroke="#1e1e30"/>
      <use href="#gh-icon" transform="translate(14,14) scale(0.9)"/>
      <text x="44" y="26" fill="#f0f0f5" font-weight="600" font-size="11">GitHub Repository</text>
      <text x="44" y="41" fill="rgba(240,240,245,0.55)" font-size="8.5">Source · CI/CD · Trivy + Dependabot</text>
    </g>
    <g transform="translate(316,98)">
      <rect width="270" height="56" rx="8" fill="#1a1409" stroke="#3a2410"/>
      <use href="#cloud-icon" transform="translate(14,15) scale(0.9)"/>
      <text x="44" y="26" fill="#fb923c" font-weight="600" font-size="11">Cloudflare Pages</text>
      <text x="44" y="41" fill="rgba(240,240,245,0.55)" font-size="8.5">Static hosting + /ai/ask function</text>
    </g>
    <g transform="translate(600,98)">
      <rect width="270" height="56" rx="8" fill="#0d1522" stroke="#1c2c42"/>
      <use href="#browser-icon" transform="translate(14,17) scale(0.85)"/>
      <text x="44" y="26" fill="#5b9ef9" font-weight="600" font-size="11">User's Browser</text>
      <text x="44" y="41" fill="rgba(240,240,245,0.55)" font-size="8.5">Receives + runs the SPA</text>
    </g>
    <g transform="translate(884,98)">
      <rect width="270" height="56" rx="8" fill="#0d1522" stroke="#1c2c42" stroke-dasharray="5 3"/>
      <use href="#shield-icon" transform="translate(14,15) scale(0.85)"/>
      <text x="44" y="26" fill="#5b9ef9" font-weight="600" font-size="11">User's Entra Tenant</text>
      <text x="44" y="41" fill="rgba(240,240,245,0.55)" font-size="8.5">App reg (PKCE SPA) · set up once</text>
    </g>
  </g>

  <path d="M302,126 L316,126" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M586,126 L600,126" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M870,126 L884,126" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>

  <!-- ── BROWSER APPLICATION ──────────────────────────────────── -->
  <text x="32" y="176" fill="rgba(240,240,245,0.55)" font-size="10" font-weight="600" letter-spacing="1.5">BROWSER APPLICATION</text>
  <text x="200" y="176" fill="#6b7684" font-size="10">all tenant data stays here, nothing sent to any EntraPass server</text>

  <rect x="32" y="184" width="1136" height="454" rx="12" fill="none" stroke="#5b9ef9" stroke-width="1.4" stroke-dasharray="8 5" opacity="0.35"/>

  <g font-size="10">
    <g transform="translate(52,208)">
      <rect width="260" height="90" rx="8" fill="#0d1522" stroke="#1c2c42"/>
      <use href="#doc-icon" transform="translate(14,14) scale(0.85)"/>
      <text x="44" y="27" fill="#5b9ef9" font-weight="600" font-size="11">Setup Wizard</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">T&amp;Cs -&gt; app-reg guide -&gt; Client/Tenant ID</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">PKCE-only, no client secret</text>
    </g>
    <g transform="translate(326,208)">
      <rect width="260" height="90" rx="8" fill="#1a1409" stroke="#3a2410"/>
      <use href="#key-icon" transform="translate(14,14) scale(0.85)"/>
      <text x="44" y="27" fill="#fb923c" font-weight="600" font-size="11">MSAL.js (PKCE)</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">Auth code + PKCE challenge</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">Token cached in sessionStorage, ~60min</text>
    </g>
    <g transform="translate(600,208)">
      <rect width="260" height="90" rx="8" fill="#0a1710" stroke="#153322"/>
      <use href="#exchange-icon" transform="translate(14,15) scale(0.75)"/>
      <text x="44" y="27" fill="#34d399" font-weight="600" font-size="11">Graph API Client</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">12 methods · Promise.all batching</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">Auto-pagination · up to 50 users</text>
    </g>
    <g transform="translate(874,208)">
      <rect width="260" height="90" rx="8" fill="#160f22" stroke="#2c1c42"/>
      <use href="#chart-icon" transform="translate(14,14) scale(0.85)"/>
      <text x="44" y="27" fill="#a78bfa" font-weight="600" font-size="11">Analysis Engine</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">4-tier classifier · readiness score</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">App/CA/toxic-combo checks · narrative</text>
    </g>
  </g>

  <path d="M312,253 L326,253" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M586,253 L600,253" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M860,253 L874,253" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>

  <path d="M456,298 L456,318 Q456,328 380,328 L320,328 Q279,328 279,346" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>
  <path d="M960,298 L960,318 Q960,328 700,328 L560,328 Q520,328 520,346" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>
  <path d="M1004,298 L1004,346" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <g font-size="10">
    <g transform="translate(52,348)">
      <rect width="454" height="110" rx="8" fill="#1a1409" stroke="#3a2410"/>
      <use href="#save-icon" transform="translate(14,15) scale(0.85)"/>
      <text x="44" y="27" fill="#fb923c" font-weight="600" font-size="11">sessionStorage</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">entrapass_config (~150B) + entrapass_results (~50-200KB)</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">MSAL token cache also lives here</text>
      <text x="14" y="80" fill="#4a5568" font-size="8" font-style="italic">Cleared on tab close, no disk, no server copy</text>
    </g>
    <g transform="translate(524,348)">
      <rect width="610" height="110" rx="8" fill="#12161d" stroke="#242b36"/>
      <use href="#grid-icon" transform="translate(14,14) scale(0.85)"/>
      <text x="44" y="27" fill="#c9d1d9" font-weight="600" font-size="11">Dashboard · 5 tabs</text>
      <text x="14" y="50" fill="rgba(240,240,245,0.6)" font-size="8.5">Overview · Passkey Readiness · App Identities · CA Policies · AI Assistant</text>
      <text x="14" y="65" fill="#4a5568" font-size="8" font-style="italic">Filter pills · search · CSV export · rollout-phase planner</text>
      <text x="14" y="80" fill="#4a5568" font-size="8" font-style="italic">Everything rendered straight from sessionStorage</text>
    </g>
  </g>

  <!-- Container -> External services -->
  <path d="M279,638 L279,662" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M660,638 L660,662" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>
  <path d="M1004,638 L1004,662" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>

  <!-- ── EXTERNAL SERVICES ────────────────────────────────────── -->
  <text x="32" y="656" fill="rgba(240,240,245,0.55)" font-size="10" font-weight="600" letter-spacing="1.5">EXTERNAL SERVICES</text>

  <g font-size="10">
    <g transform="translate(32,664)">
      <rect width="380" height="120" rx="8" fill="#0d1522" stroke="#1c2c42"/>
      <use href="#exchange-icon" transform="translate(16,16) scale(0.85)" stroke="#5b9ef9"/>
      <text x="50" y="30" fill="#5b9ef9" font-weight="600" font-size="12">Microsoft Graph API (v1.0)</text>
      <text x="16" y="54" fill="rgba(240,240,245,0.6)" font-size="8.5">12 endpoints · read-only · delegated permissions</text>
      <text x="16" y="69" fill="rgba(240,240,245,0.6)" font-size="8.5">Users · Devices · CA Policies · Apps · Sign-ins</text>
      <text x="16" y="88" fill="#4a5568" font-size="8" font-style="italic">Calls run in-browser, never touch EntraPass servers</text>
      <text x="16" y="102" fill="#4a5568" font-size="8" font-style="italic">HTTPS/TLS · bearer token auth</text>
    </g>
    <g transform="translate(415,664)">
      <rect width="380" height="120" rx="8" fill="#0d1522" stroke="#1c2c42"/>
      <use href="#shield-icon" transform="translate(16,16) scale(0.85)"/>
      <text x="50" y="30" fill="#5b9ef9" font-weight="600" font-size="12">Microsoft Entra ID</text>
      <text x="16" y="54" fill="rgba(240,240,245,0.6)" font-size="8.5">PKCE authentication + token issuance</text>
      <text x="16" y="69" fill="rgba(240,240,245,0.6)" font-size="8.5">Token validation + delegated consent</text>
      <text x="16" y="88" fill="#4a5568" font-size="8" font-style="italic">App reg lives in the user's own tenant</text>
      <text x="16" y="102" fill="#4a5568" font-size="8" font-style="italic">Tokens expire ~60min · silent refresh via MSAL</text>
    </g>
    <g transform="translate(798,664)">
      <rect width="370" height="120" rx="8" fill="#1a1409" stroke="#3a2410" stroke-dasharray="6 3"/>
      <use href="#sparkle-icon" transform="translate(16,17) scale(0.75)"/>
      <text x="50" y="30" fill="#fb923c" font-weight="600" font-size="12">Cloudflare Workers AI</text>
      <text x="16" y="49" fill="#6b7684" font-size="9" font-style="italic">optional, AI Assistant only, off by default</text>
      <text x="16" y="70" fill="rgba(240,240,245,0.6)" font-size="8.5">Receives a count-only summary</text>
      <text x="16" y="85" fill="rgba(240,240,245,0.6)" font-size="8.5">No user names, UPNs, or tenant identifiers</text>
      <text x="16" y="103" fill="#4a5568" font-size="8" font-style="italic">Rate-limited · CORS-protected</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="810" text-anchor="middle" fill="#4a5568" font-size="9">EntraPass · github.com/arusso-aboutcloud/EntraPass · Built by Aboutcloud (aboutcloud.io) · MIT License</text>
</svg>
