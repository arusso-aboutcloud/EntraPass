<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#5b9ef9"/>
    </marker>
    <marker id="arr-l" markerWidth="9" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="9 0,0 3.5,9 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="10" fill="#08080f"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="none" stroke="#1c1c2c" stroke-width="1"/>

  <!-- Left: User's Browser -->
  <rect x="20" y="20" width="320" height="300" rx="10" fill="#0d1522" stroke="#1c2c42" stroke-width="1.4"/>
  <text x="180" y="42" text-anchor="middle" fill="#5b9ef9" font-size="14" font-weight="700">User's Browser (SPA)</text>
  <line x1="36" y1="52" x2="324" y2="52" stroke="#1c2c42" stroke-width="1"/>

  <g font-size="10.5">
    <rect x="36" y="66" width="288" height="36" rx="6" fill="#12161d" stroke="#242b36"/>
    <text x="52" y="82" fill="#c9d1d9" font-weight="600" font-size="11">Setup Wizard</text>
    <text x="52" y="96" fill="#9aa4b2" font-size="8.5">Terms &amp; Conditions · Client / Tenant ID</text>

    <rect x="36" y="110" width="288" height="36" rx="6" fill="#12161d" stroke="#242b36"/>
    <text x="52" y="126" fill="#c9d1d9" font-weight="600" font-size="11">MSAL.js · PKCE Auth</text>
    <text x="52" y="140" fill="#9aa4b2" font-size="8.5">Authorization code + S256 challenge</text>

    <rect x="36" y="154" width="288" height="36" rx="6" fill="#12161d" stroke="#242b36"/>
    <text x="52" y="170" fill="#c9d1d9" font-weight="600" font-size="11">Graph API Client</text>
    <text x="52" y="184" fill="#9aa4b2" font-size="8.5">Fetches users, devices, policies, apps</text>

    <rect x="36" y="198" width="288" height="36" rx="6" fill="#12161d" stroke="#242b36"/>
    <text x="52" y="214" fill="#c9d1d9" font-weight="600" font-size="11">Analysis Engine</text>
    <text x="52" y="228" fill="#9aa4b2" font-size="8.5">Readiness score, tiers, risks, CA advisor</text>

    <rect x="36" y="242" width="288" height="36" rx="6" fill="#12161d" stroke="#242b36"/>
    <text x="52" y="258" fill="#c9d1d9" font-weight="600" font-size="11">Dashboard + sessionStorage</text>
    <text x="52" y="272" fill="#9aa4b2" font-size="8.5">No data persisted beyond the browser tab</text>
  </g>

  <!-- Right: Microsoft Graph API -->
  <rect x="560" y="20" width="320" height="300" rx="10" fill="#0a1710" stroke="#153322" stroke-width="1.4"/>
  <text x="720" y="42" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">Microsoft Graph API</text>
  <line x1="576" y1="52" x2="864" y2="52" stroke="#153322" stroke-width="1"/>

  <g font-size="10.5">
    <rect x="576" y="66" width="288" height="36" rx="6" fill="#0f1a13" stroke="#1e3326"/>
    <text x="592" y="82" fill="#c9d1d9" font-weight="600" font-size="11">/users · profiles</text>
    <text x="592" y="96" fill="#9aa4b2" font-size="8.5">displayName, UPN, signInActivity</text>

    <rect x="576" y="110" width="288" height="36" rx="6" fill="#0f1a13" stroke="#1e3326"/>
    <text x="592" y="126" fill="#c9d1d9" font-weight="600" font-size="11">/devices · inventory</text>
    <text x="592" y="140" fill="#9aa4b2" font-size="8.5">OS, version, compliance state</text>

    <rect x="576" y="154" width="288" height="36" rx="6" fill="#0f1a13" stroke="#1e3326"/>
    <text x="592" y="170" fill="#c9d1d9" font-weight="600" font-size="10.5">/conditionalAccessPolicies</text>
    <text x="592" y="184" fill="#9aa4b2" font-size="8.5">All CA policy definitions</text>

    <rect x="576" y="198" width="288" height="36" rx="6" fill="#0f1a13" stroke="#1e3326"/>
    <text x="592" y="214" fill="#c9d1d9" font-weight="600" font-size="10.5">/applications, /servicePrincipals</text>
    <text x="592" y="228" fill="#9aa4b2" font-size="8.5">App identities, credential exposure</text>

    <rect x="576" y="242" width="288" height="36" rx="6" fill="#0f1a13" stroke="#1e3326"/>
    <text x="592" y="258" fill="#c9d1d9" font-weight="600" font-size="10.5">/authenticationMethods</text>
    <text x="592" y="272" fill="#9aa4b2" font-size="8.5">FIDO2, MFA presence flags (not secrets)</text>
  </g>

  <!-- Center arrows -->
  <line x1="342" y1="148" x2="558" y2="148" stroke="#5b9ef9" stroke-width="1.6" marker-end="url(#arr-r)"/>
  <rect x="388" y="128" width="124" height="18" rx="9" fill="#0a0d12" stroke="#1c2c42"/>
  <text x="450" y="140.5" text-anchor="middle" fill="#5b9ef9" font-size="9.5" font-weight="600">bearer token</text>

  <line x1="558" y1="176" x2="342" y2="176" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr-l)"/>
  <rect x="388" y="178" width="124" height="18" rx="9" fill="#0a0d12" stroke="#153322"/>
  <text x="450" y="190.5" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="600">JSON response</text>

  <!-- Footer -->
  <text x="450" y="342" text-anchor="middle" fill="#6b7684" font-size="9.5">Read-only delegated scopes · PKCE (S256) · no client secret · browser-only · no EntraPass backend</text>
</svg>
